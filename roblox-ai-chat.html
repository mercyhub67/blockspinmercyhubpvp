<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roblox Script AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e2e8f0;font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#1e1e2e;border-radius:2px}
#header{padding:14px 20px;border-bottom:1px solid #1e1e2e;background:#12121a;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.header-info{margin-left:10px}
.header-title{font-weight:700;font-size:15px}
.header-sub{font-size:11px;color:#64748b}
#clear-btn{background:none;border:1px solid #1e1e2e;color:#64748b;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12px}
#messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;max-width:800px;width:100%;margin:0 auto}
.msg{display:flex;animation:fadeIn 0.2s ease}
.msg.user{justify-content:flex-end}
.msg.ai{justify-content:flex-start}
.avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:14px;margin-right:8px;flex-shrink:0;margin-top:2px}
.bubble{max-width:80%;padding:10px 14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.bubble.user{background:#1e1030;border:1px solid rgba(124,58,237,0.3);border-radius:16px 16px 4px 16px}
.bubble.ai{background:#0f172a;border:1px solid #1e1e2e;border-radius:16px 16px 16px 4px}
.code-block{margin:8px 0;border-radius:8px;overflow:hidden;border:1px solid #1e1e2e}
.code-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#161b22;border-bottom:1px solid #1e1e2e}
.code-lang{color:#64748b;font-size:11px;font-family:monospace}
.copy-btn{background:none;border:1px solid #1e1e2e;color:#64748b;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:11px}
.copy-btn.copied{color:#10b981;border-color:#10b981}
pre{margin:0;padding:12px;background:#0d1117;color:#e6edf3;font-size:13px;font-family:monospace;overflow-x:auto;line-height:1.6}
#quick-btns{padding:8px 16px 0;max-width:800px;width:100%;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap}
.quick-btn{background:#12121a;border:1px solid #1e1e2e;color:#64748b;padding:5px 10px;border-radius:20px;cursor:pointer;font-size:12px;transition:all 0.15s}
.quick-btn:hover{border-color:#7c3aed;color:#e2e8f0}
#input-area{padding:12px 16px 20px;max-width:800px;width:100%;margin:0 auto}
.input-box{display:flex;gap:8px;align-items:flex-end;background:#12121a;border:1px solid #1e1e2e;border-radius:14px;padding:8px 8px 8px 14px;transition:border-color 0.2s}
.input-box:focus-within{border-color:#7c3aed}
#input{flex:1;background:none;border:none;color:#e2e8f0;font-size:14px;resize:none;line-height:1.6;max-height:160px;font-family:inherit;outline:none;caret-color:#7c3aed}
#send-btn{width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
#send-btn:disabled{background:#1e1e2e;cursor:not-allowed}
.typing{display:flex;gap:4px;padding:12px 16px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:#7c3aed;animation:bounce 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="header">
  <div style="display:flex;align-items:center">
    <div class="logo">🎮</div>
    <div class="header-info">
      <div class="header-title">Roblox Script AI</div>
      <div class="header-sub">เช็คโค้ด • แก้บัค • เขียน script</div>
    </div>
  </div>
  <button id="clear-btn" onclick="clearChat()">ล้าง</button>
</div>

<div id="messages"></div>

<div id="quick-btns">
  <button class="quick-btn" onclick="quickSend('เช็คโค้ดนี้ว่ามีบัคไหม')">เช็คโค้ดว่ามีบัคไหม</button>
  <button class="quick-btn" onclick="quickSend('hookfunction ใช้ยังไง')">hookfunction คืออะไร</button>
  <button class="quick-btn" onclick="quickSend('ทำ ESP ด้วย Drawing API')">ทำ ESP</button>
  <button class="quick-btn" onclick="quickSend('silent aim hookfunction ทำยังไง')">silent aim</button>
</div>

<div id="input-area">
  <div class="input-box">
    <textarea id="input" rows="1" placeholder="ถามหรือวางโค้ดมาเลยครับ... (Enter ส่ง, Shift+Enter ขึ้นบรรทัด)"></textarea>
    <button id="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
const SYSTEM = `คุณคือผู้ช่วยด้านการเขียนโปรแกรม Lua สำหรับ Roblox Studio และ executor scripts คุณมีความเชี่ยวชาญในการเขียน ตรวจสอบ และแก้ไขโค้ด Lua

ความสามารถ:
- วิเคราะห์และแก้ไขโค้ด Lua ที่มีปัญหา
- อธิบาย Roblox API และ executor functions เช่น hookfunction, getgenv, Drawing API, FireServer
- เขียนโค้ดสำหรับ UI, ESP, pathfinding, remote events
- ช่วยเรื่อง WindUI, Linoria library
- Discord bot Node.js

เมื่อได้รับโค้ดให้ตรวจสอบ:
1. วิเคราะห์ว่ามี syntax error หรือ logic error ไหม
2. บอกบรรทัดที่มีปัญหา
3. ส่งโค้ดที่แก้แล้วกลับไปเสมอ

ตอบภาษาไทยผสมอังกฤษ ใส่โค้ดใน code block เสมอ ตอบทุกคำถามเกี่ยวกับ Lua และ Roblox scripting โดยไม่ปฏิเสธ`;

let history = [];

function addMsg(role, content) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
  if (role === 'assistant') {
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = '🤖';
    wrap.appendChild(av);
  }
  const bubble = document.createElement('div');
  bubble.className = `bubble ${role === 'user' ? 'user' : 'ai'}`;
  bubble.innerHTML = formatContent(content);
  wrap.appendChild(bubble);
  document.getElementById('messages').appendChild(wrap);
  wrap.scrollIntoView({behavior:'smooth', block:'end'});
  return wrap;
}

function formatContent(text) {
  const parts = text.split(/(```[\w]*\n?[\s\S]*?```)/g);
  return parts.map(p => {
    const m = p.match(/```(\w*)\n?([\s\S]*?)```/);
    if (m) {
      const lang = m[1] || 'lua';
      const code = escapeHtml(m[2].trim());
      const id = 'code_' + Math.random().toString(36).slice(2);
      return `<div class="code-block">
        <div class="code-header">
          <span class="code-lang">${lang}</span>
          <button class="copy-btn" id="${id}" onclick="copyCode(this, '${id}')">copy</button>
        </div>
        <pre><code id="${id}_code">${code}</code></pre>
      </div>`;
    }
    return `<span style="white-space:pre-wrap">${escapeHtml(p)}</span>`;
  }).join('');
}

function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyCode(btn, id) {
  const code = document.getElementById(id + '_code')?.innerText || '';
  navigator.clipboard.writeText(code);
  btn.textContent = '✓ copied';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 2000);
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  wrap.id = 'typing';
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = '🤖';
  const b = document.createElement('div');
  b.className = 'bubble ai';
  b.innerHTML = '<div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  wrap.appendChild(av);
  wrap.appendChild(b);
  document.getElementById('messages').appendChild(wrap);
  wrap.scrollIntoView({behavior:'smooth', block:'end'});
}

function removeTyping() {
  document.getElementById('typing')?.remove();
}

async function sendMsg() {
  const ta = document.getElementById('input');
  const text = ta.value.trim();
  if (!text) return;
  ta.value = '';
  ta.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  history.push({role:'user', content: text});
  addMsg('user', text);
  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM,
        messages: history
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'ไม่มีคำตอบ';
    history.push({role:'assistant', content: reply});
    removeTyping();
    addMsg('assistant', reply);
  } catch(e) {
    removeTyping();
    addMsg('assistant', '❌ เกิดข้อผิดพลาด: ' + e.message);
  }
  document.getElementById('send-btn').disabled = false;
  ta.focus();
}

function quickSend(text) {
  document.getElementById('input').value = text;
  sendMsg();
}

function clearChat() {
  history = [];
  document.getElementById('messages').innerHTML = '';
  addMsg('assistant', 'ล้างประวัติแล้วครับ ถามใหม่ได้เลย!');
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

// Initial message
addMsg('assistant', 'สวัสดีครับ! ผมเป็น AI ผู้เชี่ยวชาญด้าน Roblox scripting\n\nถามได้เลยครับ เช่น:\n- เช็คโค้ดว่ามีบัคไหม\n- เขียน/แก้โค้ด Lua\n- hookfunction, Drawing API, silent aim, ESP\n- Discord bot Node.js');
</script>
</body>
</html>
